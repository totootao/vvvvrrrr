name: 🌱 WorkBuddy Daily

on:
  schedule:
    - cron: "0 23 * * *"     # 北京 07:00
    - cron: "0 4 * * *"     # 北京 12:00
    - cron: "30 15 * * *"     # 北京 23:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

env:
  # 私有令牌持久化仓库：存明文 RT，必须保持 Private
  TOKEN_REPO: totootao/wb-tokens

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      # 回归测试：2026-10-23 起工作流连续 red 的根因是裸 .json() 撞上网关非 JSON
      # 响应。改动脚本后先跑测试，防止同类回归再上去。测试全用假响应，不碰网络。
      - name: Regression tests
        run: python tests/test_signin_hardening.py

      # 从私有令牌仓库拉最新令牌状态（含上次运行轮换出的新 RT）。
      # 拉不到（首次运行/仓库被删）也不影响：脚本会从 WORKBUDDY_REFRESH_TOKEN 自举。
      - name: Load token state (private repo)
        env:
          WB_TOKEN_REPO_PAT: ${{ secrets.WB_TOKEN_REPO_PAT }}
        run: |
          code=$(curl -sS -o wb_refresh_tokens.json -w "%{http_code}" \
            -H "Authorization: token $WB_TOKEN_REPO_PAT" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$TOKEN_REPO/contents/wb_refresh_tokens.json?ref=main")
          if [ "$code" = "200" ] && [ -s wb_refresh_tokens.json ]; then
            echo "✅ 已从 $TOKEN_REPO 载入令牌状态"
          else
            echo "⚠️ 令牌仓库无有效令牌文件（HTTP $code），将从 Secret 自举"
            rm -f wb_refresh_tokens.json
          fi

      - name: Run WorkBuddy
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python workbuddy_daily.py

      # 运行后把轮换出的最新令牌写回私有仓库持久化。
      # ⚠️ 本仓库(vvvvrrrr)是公开的，明文 RT 绝不写到这里；只写 TOKEN_REPO。
      # 推送失败时自动刷新文件 sha 重试（处理并发提交），失败不吞——Secret 兜底仍在。
      - name: Persist token state (private repo)
        if: always()
        env:
          WB_TOKEN_REPO_PAT: ${{ secrets.WB_TOKEN_REPO_PAT }}
        run: |
          if [ ! -s wb_refresh_tokens.json ]; then
            echo "无令牌文件，跳过持久化"
            exit 0
          fi
          api() { curl -sS -H "Authorization: token $WB_TOKEN_REPO_PAT" \
                       -H "Accept: application/vnd.github+json" "$@"; }
          msg="chore: 更新令牌状态 [skip ci]"
          for i in 1 2 3 4 5; do
            sha=$(api "https://api.github.com/repos/$TOKEN_REPO/contents/wb_refresh_tokens.json?ref=main" \
                  | jq -r '.sha // empty')
            if [ -n "$sha" ]; then
              jq -n --arg m "$msg" --arg s "$sha" --rawfile c wb_refresh_tokens.json \
                 '{message:$m, sha:$s, content:($c|@base64)}' > body.json
            else
              jq -n --arg m "$msg" --rawfile c wb_refresh_tokens.json \
                 '{message:$m, content:($c|@base64)}' > body.json
            fi
            code=$(curl -sS -o resp.json -w "%{http_code}" -X PUT \
              -H "Authorization: token $WB_TOKEN_REPO_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$TOKEN_REPO/contents/wb_refresh_tokens.json" \
              --data @body.json)
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "✅ 令牌状态已持久化到 $TOKEN_REPO"
              exit 0
            fi
            echo "第 $i 次持久化失败 (HTTP $code): $(head -c 200 resp.json)"
            sleep 5
          done
          echo "::error::令牌状态持久化失败 —— Secret 兜底仍在，但本轮轮换的新 RT 未落库"
          exit 1
